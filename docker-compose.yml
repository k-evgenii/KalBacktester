services:
  db:
    image: postgres:16
    container_name: kalbt-recon-db
    restart: unless-stopped

    # Credentials come from .env, never from this file.
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-kalbt}
      POSTGRES_USER:     ${POSTGRES_USER:-kalbt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      TZ: UTC
      PGTZ: UTC

    # Loopback only. 5433 so it does not clash with the legacy kbt4-db on 5432.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"

    volumes:
      - kalbt_recon_pgdata:/var/lib/postgresql/data
      # Runs once, on first init of an empty data volume.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kalbt} -d ${POSTGRES_DB:-kalbt}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kalbt_recon_pgdata:
